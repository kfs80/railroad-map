<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Great Model Railroad Database</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  
  <style>
    /* Global Styles matching your Travel file aesthetic */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Trebuchet MS', sans-serif;
      background-color: #f0f4f1;
      color: #2b2b2b;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header Styling */
    header {
      background-color: #2c4c3b;
      color: white;
      padding: 20px 30px;
      border-bottom: 6px solid #b75d3c;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      z-index: 1000;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: normal;
    }
    header p {
      margin: 5px 0 0 0;
      color: #e1ede5;
      font-style: italic;
      font-size: 14px;
    }

    /* Main Layout */
    .dashboard {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar: Top 10 List */
    .sidebar {
      width: 400px;
      background: white;
      overflow-y: auto;
      border-right: 2px solid #dbe2dd;
      padding: 20px;
      box-sizing: border-box;
    }
    .sidebar h2 {
      margin-top: 0;
      color: #2c4c3b;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    /* List Cards */
    .museum-card {
      background: #f9f9f9;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 20px;
      overflow: hidden;
      transition: transform 0.2s;
      cursor: pointer;
    }
    .museum-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      border-color: #b75d3c;
    }
    .card-img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background-color: #ccc;
    }
    .card-content {
      padding: 15px;
    }
    .card-content h3 {
      margin: 0 0 5px 0;
      color: #2c4c3b;
      font-size: 16px;
    }
    .card-content p {
      margin: 0;
      font-size: 13px;
      color: #555;
      line-height: 1.4;
    }

    /* Map Window */
    .map-container {
      flex: 1;
      position: relative;
    }
    #map {
      height: 100%;
      width: 100%;
    }

    /* Leaflet Popup Styling */
    .popup-card h3 { margin: 0 0 5px 0; color: #2c4c3b; font-size: 15px; }
    .popup-card p { margin: 0 0 10px 0; font-size: 12px; color: #333; }
    .popup-card a { color: #b75d3c; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Website Header -->
  <header>
    <h1>The Great Model Railroad Database</h1>
    <p>A curated map of the top miniature rail displays across the United States.</p>
  </header>

  <!-- Split Dashboard Layout -->
  <div class="dashboard">
    
    <!-- Sidebar / Top 10 List -->
    <div class="sidebar">
      <h2>The Top 10 Must-See Layouts</h2>
      <div id="top-10-list">
        <!-- Javascript will inject the cards here automatically -->
      </div>
    </div>

    <!-- Map Window -->
    <div class="map-container">
      <div id="map"></div>
    </div>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  
  <script>
    // 1. Initialize Map
    var map = L.map('map').setView([39.8283, -98.5795], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 18
    }).addTo(map);

    // 2. Data List (Add your own image URLs to the "img" fields below!)
    var museums = [
      {
        name: "San Diego Model Railroad Museum",
        lat: 32.7313, lng: -117.1480,
        desc: "27,000 sq. ft. of incredibly detailed HO and N scale layouts modeling historic California rail lines.",
        link: "https://www.sdmrm.org",
        img: "https://placehold.co/400x300/2c4c3b/ffffff?text=San+Diego+Museum" 
      },
      {
        name: "Golden State Model Railroad Museum",
        lat: 37.9255, lng: -122.3812,
        desc: "A massive 10,000-square-foot facility featuring functioning models of classic California railroad eras.",
        link: "https://www.gsmrm.org",
        img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Golden+State+Museum"
      },
      {
        name: "Pasadena Model Railroad Museum",
        lat: 34.0298, lng: -118.1517,
        desc: "Home to the 'Sierra Pacific Lines,' one of the largest operating HO scale model railroads in the world.",
        link: "https://www.pmrrc.org",
        img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Pasadena+Museum"
      },
      {
        name: "Colorado Model Railroad Museum",
        lat: 40.4243, lng: -104.6881,
        desc: "A 5,500 sq. ft. masterpiece featuring a floor-to-ceiling mountainous logging layout.",
        link: "https://www.cmrm.org",
        img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Colorado+Museum"
      },
      {
        name: "Museum of Science and Industry",
        lat: 41.7905, lng: -87.5830,
        desc: "Home to 'The Great Train Story' depicting the winding rail journey between Seattle and Chicago.",
        link: "https://www.msichicago.org",
        img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Great+Train+Story"
      },
      {
        name: "EnterTRAINment Junction",
        lat: 39.3400, lng: -84.3980,
        desc: "Boasts a staggering 25,000-square-foot G-scale layout and interactive walking paths.",
        link: "https://entertrainmentjunction.com",
        img: "https://placehold.co/400x300/2c4c3b/ffffff?text=EnterTRAINment"
      },
      {
        name: "Twin City Model Railroad Museum",
        lat: 44.9655, lng: -93.1865,
        desc: "An O-scale layout packed with recognizable local landmarks and historical accuracy from the 1930s.",
        link: "https://www.tcmrm.org",
        img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Twin+City+Museum"
      },
      {
        name: "Cornerfield Model Railroad Museum",
        lat: 41.5173, lng: -81.0454,
        desc: "One of the largest family-owned O-Gauge layouts in America featuring beautifully crafted rolling hills.",
        link: "https://cornerfieldmodelrailroadmuseumandhobby.com",
        img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Cornerfield+Museum"
      },
      {
        name: "Northlandz",
        lat: 40.5284, lng: -74.8876,
        desc: "Features 8 miles of miniature track and towering canyon bridges that reach up to three stories high.",
        link: "https://northlandz.com",
        img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Northlandz"
      },
      {
        name: "Carnegie Science Center",
        lat: 40.4457, lng: -80.0177,
        desc: "Houses the 'Miniature Railroad & Village,' perfectly capturing Western Pennsylvania in the late 1800s.",
        link: "https://carnegiesciencecenter.org",
        img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Carnegie+Science"
      }
      // Note: You can paste the remaining 20 locations from the previous code here! 
      // They will appear on the map, but only the first 10 will render in the sidebar.
    ];

    // Store map markers so the sidebar can trigger them
    var markers = [];

    // 3. Build the Map Pins and Sidebar Cards
    var sidebarContainer = document.getElementById('top-10-list');

    museums.forEach(function(museum, index) {
      // Build Map Popup
      var popupHTML = "<div class='popup-card'>" +
                      "<h3>" + museum.name + "</h3>" +
                      "<p>" + museum.desc + "</p>" +
                      "<a href='" + museum.link + "' target='_blank'>Visit Website &rarr;</a>" +
                      "</div>";
      
      // Create Marker
      var marker = L.marker([museum.lat, museum.lng]).addTo(map).bindPopup(popupHTML);
      markers.push(marker);

      // Build Sidebar Card (Only for the first 10)
      if(index < 10) {
        var cardHTML = `
          <div class="museum-card" onclick="focusMap(${index})">
            <img src="${museum.img}" alt="${museum.name}" class="card-img">
            <div class="card-content">
              <h3>${index + 1}. ${museum.name}</h3>
              <p>${museum.desc}</p>
            </div>
          </div>
        `;
        sidebarContainer.innerHTML += cardHTML;
      }
    });

    // 4. Function to pan the map when a sidebar card is clicked
    function focusMap(index) {
      var targetMarker = markers[index];
      map.setView(targetMarker.getLatLng(), 12); // Zoom in on location
      targetMarker.openPopup();
    }
  </script>
</body>
</html>
