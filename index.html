<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Great Model Railroad Database</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  
  <style>
    body { margin: 0; padding: 0; font-family: 'Trebuchet MS', sans-serif; background-color: #f0f4f1; color: #2b2b2b; display: flex; flex-direction: column; height: 100vh; }
    
    /* Enhanced Header with Background Image and Gradient Overlay */
    header {
      background: linear-gradient(rgba(44, 76, 59, 0.85), rgba(44, 76, 59, 0.95)), url('https://upload.wikimedia.org/wikipedia/commons/7/7b/HO_scale_model_train.jpg');
      background-size: cover;
      background-position: center;
      color: white;
      padding: 24px 30px;
      border-bottom: 6px solid #b75d3c;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      z-index: 1000;
    }
    header h1 { margin: 0; font-size: 28px; font-weight: normal; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    header p { margin: 5px 0 0 0; color: #e1ede5; font-style: italic; font-size: 14px; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }

    .dashboard { display: flex; flex: 1; overflow: hidden; }
    
    .sidebar { width: 420px; background: white; overflow-y: auto; border-right: 2px solid #dbe2dd; padding: 20px; box-sizing: border-box; }
    .sidebar h2 { margin-top: 0; color: #2c4c3b; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 18px; }

    /* Museum Card Styling */
    .museum-card { 
      background: #f9f9f9; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      margin-bottom: 20px; 
      overflow: hidden; 
      transition: transform 0.2s, box-shadow 0.2s; 
      cursor: pointer; 
    }
    .museum-card:hover { 
      transform: translateY(-3px); 
      box-shadow: 0 6px 12px rgba(0,0,0,0.1); 
      border-color: #b75d3c; 
    }

    .card-img { width: 100%; height: 130px; object-fit: cover; background-color: #ccc; }

    /* Compact Green Header Box */
    .card-header-box {
      background-color: #2c4c3b;
      color: white;
      padding: 10px 15px;
      position: relative;
    }
    .card-state { font-size: 10px; font-weight: bold; color: #d49b82; text-transform: uppercase; margin: 0 0 2px 0; letter-spacing: 0.5px; }
    .card-header-box h3 { margin: 0; font-size: 15px; font-weight: 600; color: #ffffff; }

    /* Train Track Separator Graphic */
    .train-separator {
      height: 6px;
      background: #1a2e24;
      display: flex;
      align-items: center;
      justify-content: space-around;
      position: relative;
      border-bottom: 1px solid #b75d3c;
    }
    .train-separator::before {
      content: "🚂 🚃 🚃";
      font-size: 9px;
      position: absolute;
      top: -4px;
      letter-spacing: 6px;
      width: 100%;
      text-align: center;
    }

    .card-content { padding: 12px 15px; background: white; }
    .card-content p { margin: 0 0 8px 0; font-size: 12px; color: #555; line-height: 1.4; }
    .card-link { color: #b75d3c; text-decoration: none; font-weight: bold; font-size: 12px; display: inline-block; }
    .card-link:hover { text-decoration: underline; }

    .map-container { flex: 1; position: relative; }
    #map { height: 100%; width: 100%; }

    .popup-card h3 { margin: 0 0 5px 0; color: #2c4c3b; font-size: 15px; }
    .popup-card p { margin: 0 0 10px 0; font-size: 12px; color: #333; }
    .popup-card a { color: #b75d3c; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 5px; }
  </style>
</head>
<body>

  <header>
    <h1>The Great Model Railroad Database</h1>
    <p>A curated interactive map of top miniature rail displays across the United States.</p>
  </header>

  <div class="dashboard">
    <div class="sidebar">
      <h2>All Masterpieces (Sorted by State)</h2>
      <div id="museum-list">
        <!-- Javascript injects all cards here -->
      </div>
    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  
  <script>
    var map = L.map('map').setView([39.8283, -98.5795], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 18
    }).addTo(map);

    var museums = [
      { state: "Alabama", name: "Foley Railroad Museum", lat: 30.4066, lng: -87.6811, desc: "Located in a historic 1909 depot, this massive O-gauge exhibit spans a quarter of a mile of track.", link: "https://visitfoley.com", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Foley+Railroad" },
      { state: "California", name: "Golden State Model Railroad Museum", lat: 37.9255, lng: -122.3812, desc: "A massive 10,000-square-foot facility featuring functioning models of classic California railroad eras.", link: "https://www.gsmrm.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Golden+State" },
      { state: "California", name: "Pasadena Model Railroad Club", lat: 34.0298, lng: -118.1517, desc: "Home to the 'Sierra Pacific Lines,' one of the largest operating HO scale model railroads in the world.", link: "https://www.pmrrc.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Pasadena+Club" },
      { state: "California", name: "San Diego Model Railroad Museum", lat: 32.7313, lng: -117.1480, desc: "27,000 sq. ft. of incredibly detailed HO and N scale layouts modeling historic California rail lines.", link: "https://www.sdmrm.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=San+Diego+Museum" },
      { state: "California", name: "South Bay Historical Railroad Society", lat: 37.3533, lng: -121.9366, desc: "Located inside a historic 1862 depot featuring massive operating layouts preserving Santa Clara history.", link: "https://www.sbhrs.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=South+Bay" },
      { state: "Colorado", name: "Colorado Model Railroad Museum", lat: 40.4243, lng: -104.6881, desc: "A 5,500 sq. ft. masterpiece featuring a floor-to-ceiling mountainous logging layout.", link: "https://www.cmrm.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Colorado+Museum" },
      { state: "Florida", name: "Rockledge Model Railroad Museum", lat: 28.3094, lng: -80.7350, desc: "Showcases highly intricate HO-scale models that capture the rugged terrain of the Appalachian regions.", link: "https://rockledgemrm.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Rockledge+Museum" },
      { state: "Illinois", name: "Museum of Science and Industry", lat: 41.7905, lng: -87.5830, desc: "Home to 'The Great Train Story' depicting the winding rail journey between Seattle and Chicago.", link: "https://www.msichicago.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=MSI+Chicago" },
      { state: "Indiana", name: "National New York Central Railroad Museum", lat: 41.6818, lng: -85.9734, desc: "Houses detailed HO and O-scale layouts that recreate the bustling, historic rail yards of Elkhart.", link: "https://elkhartindiana.org/nnycrm/", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=NY+Central" },
      { state: "Kentucky", name: "Historic RailPark and Train Museum", lat: 37.0016, lng: -86.4428, desc: "Houses a phenomenal permanent HO-scale layout capturing local Kentucky rail history.", link: "https://www.historicrailpark.com", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Historic+RailPark" },
      { state: "Maryland", name: "B&O Railroad Museum", lat: 39.2854, lng: -76.6327, desc: "Houses a massive HO-scale layout highlighting the engineering feats required to cross the Appalachians.", link: "https://www.borail.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=B%26O+Railroad" },
      { state: "Massachusetts", name: "Wenham Museum", lat: 42.6074, lng: -70.8931, desc: "A staple of New England rail modeling featuring antique toy trains and intricate operating layouts.", link: "https://www.wenhammuseum.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Wenham+Museum" },
      { state: "Minnesota", name: "Twin City Model Railroad Museum", lat: 44.9655, lng: -93.1865, desc: "An O-scale layout packed with recognizable local landmarks and historical accuracy from the 1930s.", link: "https://www.tcmrm.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Twin+City" },
      { state: "Mississippi", name: "TrainTastic", lat: 30.4072, lng: -89.0537, desc: "A massive 50,000 sq. ft. facility featuring monumental, state-of-the-art interactive layouts.", link: "https://traintastic.com", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=TrainTastic" },
      { state: "Missouri", name: "Iron Spike Model Train Museum", lat: 38.5447, lng: -91.0244, desc: "One of the Midwest's premier model train attractions featuring massive, intricate N-scale and operating layouts.", link: "https://www.ironspike.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Iron+Spike" },
      { state: "New Jersey", name: "Northlandz", lat: 40.5284, lng: -74.8876, desc: "Features 8 miles of miniature track and towering canyon bridges that reach up to three stories high.", link: "https://northlandz.com", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Northlandz" },
      { state: "New York", name: "Bullthistle Model Railroad Museum", lat: 42.5312, lng: -75.5255, desc: "A regional gem featuring multiple scales preserving New York's local rail history.", link: "https://www.bullthistlemuseum.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Bullthistle" },
      { state: "New York", name: "Medina Railroad Museum", lat: 43.2238, lng: -78.3846, desc: "Located inside a massive wooden freight depot boasting a colossal 2,040 sq. ft. HO-scale layout.", link: "https://medinarailroadmuseum.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Medina+Railroad" },
      { state: "North Carolina", name: "Apple Valley Model Railroad Club", lat: 35.3207, lng: -82.4571, desc: "Housed inside a 1902 depot, featuring a massive 22x100-foot HO layout modeling western NC terrain.", link: "https://www.avmrc.com", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Apple+Valley" },
      { state: "North Carolina", name: "Smoky Mountain Trains Museum", lat: 35.4300, lng: -83.4475, desc: "Houses an operating layout alongside a collection of over 7,000 vintage Lionel engines.", link: "https://www.gsmr.com/smoky-mountain-trains-museum/", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Smoky+Mountain" },
      { state: "Ohio", name: "Cornerfield Model Railroad Museum", lat: 41.5173, lng: -81.0454, desc: "One of the largest family-owned O-Gauge layouts in America featuring beautifully crafted rolling hills.", link: "https://cornerfieldmodelrailroadmuseumandhobby.com", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Cornerfield" },
      { state: "Oregon", name: "Columbia Gorge Model Railroad Club", lat: 45.5539, lng: -122.6568, desc: "A breathtaking HO-scale layout that mirrors the topography of the Columbia River Gorge in the 1950s.", link: "https://www.cgmrc.com", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Columbia+Gorge" },
      { state: "Oregon", name: "Train Mountain Railroad Museum", lat: 42.5786, lng: -121.8653, desc: "The world's largest miniature railroad, spanning 2,200 acres with over 35 miles of track.", link: "https://www.tminst.org/", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Train+Mountain" },
      { state: "Pennsylvania", name: "Carnegie Science Center", lat: 40.4457, lng: -80.0177, desc: "Houses the 'Miniature Railroad & Village,' perfectly capturing Western Pennsylvania in the late 1800s.", link: "https://carnegiesciencecenter.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Carnegie+Science" },
      { state: "Pennsylvania", name: "Choo Choo Barn", lat: 39.9782, lng: -76.1666, desc: "A breathtakingly detailed, 1,700 sq. ft. handcrafted layout featuring 150 hand-built animated figures.", link: "https://www.choochoobarn.com", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Choo+Choo+Barn" },
      { state: "Pennsylvania", name: "Lehigh & Keystone Valley Model Railroad Museum", lat: 40.6259, lng: -75.3705, desc: "One of the largest layouts recreating the historic routes of the Lehigh Valley railroads.", link: "https://www.lkvmrr.com/", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Lehigh+%26+Keystone" },
      { state: "Pennsylvania", name: "National Toy Train Museum", lat: 39.9806, lng: -76.1557, desc: "Operated by the Train Collectors Association, holding massive operating layouts and vintage collections.", link: "https://www.nttmuseum.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Toy+Train+Museum" },
      { state: "Pennsylvania", name: "Western PA Model Railroad Museum", lat: 40.6300, lng: -79.9430, desc: "Dedicated to a sprawling, hyper-accurate HO-scale representation of the B&O rail line frozen in 1952.", link: "https://wpmrm.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Western+PA" },
      { state: "Texas", name: "Mabank Depot", lat: 32.3687, lng: -96.1042, desc: "A charming preservation of Texas railroad history featuring excellent custom-built model layouts.", link: "https://www.mabanktexas.com", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Mabank+Depot" },
      { state: "Texas", name: "New Braunfels Railroad Museum", lat: 29.7042, lng: -98.1250, desc: "Features highly detailed HO and N-scale layouts alongside a viewing area for real-life Union Pacific trains.", link: "https://newbraunfelsrailroadmuseum.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=New+Braunfels" },
      { state: "Virginia", name: "Ratcliffe Transportation Museum", lat: 37.0454, lng: -80.7788, desc: "Features an 80-by-26-foot O-scale model railroad meticulously recreating Pulaski in 1955.", link: "https://www.pulaskimuseums.com", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=Ratcliffe+Museum" },
      { state: "Washington", name: "Washington State History Museum", lat: 47.2443, lng: -122.4385, desc: "Features an HO-scale layout recreating Washington's rail network with a massive Tacoma Union Station.", link: "https://www.washingtonhistory.org", img: "https://placehold.co/400x300/2c4c3b/ffffff?text=WA+State+History" }
    ];

    var markers = [];
    var sidebarContainer = document.getElementById('museum-list');

    museums.forEach(function(museum, index) {
      var popupHTML = "<div class='popup-card'>" +
                      "<h3>" + museum.name + " (" + museum.state + ")</h3>" +
                      "<p>" + museum.desc + "</p>" +
                      "<a href='" + museum.link + "' target='_blank'>Visit Website &rarr;</a>" +
                      "</div>";
      
      var marker = L.marker([museum.lat, museum.lng]).addTo(map).bindPopup(popupHTML);
      markers.push(marker);

      var cardHTML = `
        <div class="museum-card" onclick="focusMap(${index})">
          <img src="${museum.img}" alt="${museum.name}" class="card-img">
          <div class="card-header-box">
            <p class="card-state">${museum.state}</p>
            <h3>${museum.name}</h3>
          </div>
          <div class="train-separator"></div>
          <div class="card-content">
            <p>${museum.desc}</p>
            <a href="${museum.link}" target="_blank" class="card-link" onclick="event.stopPropagation()">Visit Website &rarr;</a>
          </div>
        </div>
      `;
      sidebarContainer.innerHTML += cardHTML;
    });

    function focusMap(index) {
      var targetMarker = markers[index];
      map.setView(targetMarker.getLatLng(), 12); 
      targetMarker.openPopup();
    }
  </script>
</body>
</html>
