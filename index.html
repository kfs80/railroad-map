<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Model Railroad Database</title>
<meta name="description" content="An interactive map of model railroad museums, clubs and displays across the United States.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚂</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css'">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css'">
<style>
:root { --green:#2c4c3b; --rust:#a4502f; --bg:#f0f4f1; --line:#dbe2dd; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin:0; font-family:'Trebuchet MS',sans-serif; background:var(--bg); color:#2b2b2b; display:flex; flex-direction:column; height:100vh; height:100dvh; }
header { background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 6px,transparent 6px 26px),linear-gradient(var(--green),#223b2d); color:#fff; padding:22px 30px; border-bottom:6px solid var(--rust); z-index:1000; }
header h1 { margin:0; font-size:28px; font-weight:normal; }
header p { margin:5px 0 0; color:#e1ede5; font-style:italic; font-size:14px; }
.dashboard { display:flex; flex:1; min-height:0; }
.sidebar { width:420px; background:#fff; overflow-y:auto; border-right:2px solid var(--line); padding:20px; flex-shrink:0; }
.sidebar h2 { margin:0 0 12px; color:var(--green); font-size:18px; }
.filters { display:flex; gap:8px; margin-bottom:16px; position:sticky; top:-20px; background:#fff; padding:8px 0; z-index:2; }
.filters input, .filters select { font:inherit; font-size:14px; padding:8px; border:1px solid #bbb; border-radius:6px; min-width:0; }
.filters input { flex:1; }
.museum-card { display:block; width:100%; text-align:left; font:inherit; background:#fff; border:1px solid #ddd; border-left:4px solid var(--green); border-radius:8px; margin-bottom:14px; padding:14px 16px; cursor:pointer; transition:box-shadow .2s,border-color .2s; }
.museum-card:hover, .museum-card.active { border-color:var(--rust); box-shadow:0 4px 10px rgba(0,0,0,.1); }
.museum-card:focus-visible, .filters :focus-visible, .card-link:focus-visible { outline:3px solid #1b6ec2; outline-offset:2px; }
.card-state { font-size:12px; font-weight:bold; color:var(--rust); margin:0 0 4px; }
.museum-card h3 { margin:0 0 6px; color:var(--green); font-size:17px; }
.museum-card p { margin:0; font-size:13px; color:#444; line-height:1.45; }
.card-meta { margin-top:6px !important; font-size:12px !important; color:#2c4c3b !important; }
.card-link { color:var(--rust); font-weight:bold; font-size:13px; display:inline-block; margin-top:10px; }
.empty { color:#555; font-size:14px; }
.map-container { flex:1; min-width:0; }
#map { height:100%; width:100%; }
.popup-card h3 { margin:0 0 5px; color:var(--green); font-size:15px; }
.popup-card p { margin:0 0 6px; font-size:12px; }
.popup-card a { color:var(--rust); font-weight:bold; }
@media (max-width:760px) {
  header { padding:12px 16px; } header h1 { font-size:20px; } header p { display:none; }
  .dashboard { flex-direction:column-reverse; }
  .sidebar { width:100%; height:45%; border-right:0; border-top:2px solid var(--line); padding:12px; }
  .filters { top:-12px; }
  .map-container { flex:1; }
}
@media (prefers-reduced-motion:reduce) { .museum-card { transition:none; } }
</style>
</head>
<body>
<header>
  <h1>The Great Model Railroad Database</h1>
  <p>A curated interactive map of top miniature rail displays across the United States.</p>
</header>
<div class="dashboard">
  <aside class="sidebar" aria-label="Venue list">
    <h2 id="count" aria-live="polite">Loading venues…</h2>
    <div class="filters">
      <input id="search" type="search" placeholder="Search name or description" aria-label="Search venues">
      <select id="state" aria-label="Filter by state"><option value="">All states</option></select>
    </div>
    <div id="museum-list"></div>
    <noscript>This map needs JavaScript to run.</noscript>
  </aside>
  <main class="map-container"><div id="map" role="region" aria-label="Map of venues"></div></main>
</div>

<script>
function startApp() {
  var map = L.map('map').setView([39.8283, -98.5795], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 18
  }).addTo(map);

  var cluster = L.markerClusterGroup().addTo(map);
  var list = document.getElementById('museum-list');
  var countEl = document.getElementById('count');
  var searchEl = document.getElementById('search');
  var stateEl = document.getElementById('state');
  var venues = [], markers = {}, activeId = null;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function link(url, cls, text) {
    var a = el('a', cls, text);
    a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    return a;
  }
  function popup(v) {
    var d = el('div', 'popup-card');
    d.appendChild(el('h3', null, v.name + ' (' + v.state + ')'));
    d.appendChild(el('p', null, v.desc));
    if (v.size) d.appendChild(el('p', null, 'Size: ' + v.size));
    d.appendChild(link(v.link, null, 'Visit website'));
    return d;
  }

  function setActive(id) {
    activeId = id;
    list.querySelectorAll('.museum-card').forEach(function (c) {
      c.classList.toggle('active', c.dataset.id === String(id));
    });
  }

  function focusVenue(id, scroll) {
    var v = venues[id];
    map.flyTo([v.lat, v.lng], v.zoom || 12, { duration: 0.8 });
    cluster.zoomToShowLayer(markers[id], function () { markers[id].openPopup(); });
    setActive(id);
    if (scroll) {
      var card = list.querySelector('[data-id="' + id + '"]');
      if (card) card.scrollIntoView({ block: 'nearest' });
    }
  }

  function render() {
    var q = searchEl.value.trim().toLowerCase(), st = stateEl.value;
    var shown = venues.filter(function (v) {
      return (!st || v.state === st) && (!q || (v.name + ' ' + v.desc + ' ' + v.state + ' ' + (v.size || '')).toLowerCase().indexOf(q) > -1);
    });
    list.textContent = '';
    cluster.clearLayers();
    shown.forEach(function (v) {
      cluster.addLayer(markers[v.id]);
      var card = el('button', 'museum-card');
      card.type = 'button';
      card.dataset.id = v.id;
      card.appendChild(el('p', 'card-state', v.state));
      card.appendChild(el('h3', null, v.name));
      card.appendChild(el('p', null, v.desc));
      if (v.size) card.appendChild(el('p', 'card-meta', 'Size: ' + v.size));
      if (v.hours) card.appendChild(el('p', 'card-meta', 'Visit: ' + v.hours));
      card.appendChild(link(v.link, 'card-link', 'Visit website'));
      list.appendChild(card);
    });
    if (!shown.length) list.appendChild(el('p', 'empty', 'No venues match. Clear the search or choose another state.'));
    countEl.textContent = shown.length + (shown.length === 1 ? ' venue' : ' venues');
    if (shown.length && (q || st)) {
      map.fitBounds(L.latLngBounds(shown.map(function (v) { return [v.lat, v.lng]; })), { padding: [40, 40], maxZoom: 10 });
    }
    setActive(activeId);
  }

  list.addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    var card = e.target.closest('.museum-card');
    if (card) focusVenue(Number(card.dataset.id), false);
  });
  searchEl.addEventListener('input', render);
  stateEl.addEventListener('change', render);

  fetch('museums.json')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      venues = data.sort(function (a, b) { return a.state.localeCompare(b.state) || a.name.localeCompare(b.name); })
        .map(function (v, i) { v.id = i; return v; });
      var states = [];
      venues.forEach(function (v) {
        if (states.indexOf(v.state) < 0) states.push(v.state);
        var m = L.marker([v.lat, v.lng], { title: v.name }).bindPopup(function () { return popup(v); });
        m.on('click', function () { setActive(v.id); var c = list.querySelector('[data-id="' + v.id + '"]'); if (c) c.scrollIntoView({ block: 'nearest' }); });
        markers[v.id] = m;
      });
      states.forEach(function (s) { var o = el('option', null, s); o.value = s; stateEl.appendChild(o); });
      render();
    })
    .catch(function () {
      countEl.textContent = 'Could not load venues';
      list.appendChild(el('p', 'empty', 'The venue data failed to load. Refresh the page to try again.'));
    });
}

function loadScript(urls, ready, done, integrity) {
  var i = 0;
  (function next() {
    if (ready()) return done(true);
    if (i >= urls.length) return done(false);
    var s = document.createElement('script');
    s.src = urls[i++];
    if (integrity && i === 1) { s.integrity = integrity; s.crossOrigin = ''; }
    s.onload = function () { ready() ? done(true) : next(); };
    s.onerror = next;
    document.head.appendChild(s);
  })();
}

loadScript([
  'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
  'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
  'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js'
], function () { return window.L; }, function (ok) {
  if (!ok) return showLoadError();
  loadScript([
    'https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js',
    'https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js'
  ], function () { return window.L && L.markerClusterGroup; }, function (ok2) {
    ok2 ? startApp() : showLoadError();
  });
});

function showLoadError() {
  document.getElementById('count').textContent = 'Could not load the map library';
  document.getElementById('museum-list').textContent = 'The map scripts failed to load. Check your connection or ad blocker and refresh.';
}
</script>
</body>
</html>
